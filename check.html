<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>فحص المتصفح</title><style>body{background:#0b0b0d;color:#eee;font:22px/1.6 system-ui,sans-serif;padding:30px}h1{color:#ff7a00}.box{background:#18181c;border:2px solid #ff7a00;border-radius:16px;padding:22px;margin:18px 0}.big{font-size:34px;font-weight:700}.ua{direction:ltr;text-align:left;font-size:16px;color:#aaa;word-break:break-all}</style></head><body>
<h1>فحص: المتصفح شغال فين؟</h1>
<div class="box big" id="v">...</div>
<div class="box"><div id="d"></div><div class="ua" id="ua"></div></div>
<script>
var u=navigator.userAgent,car=/DFTC|M57|RP1A\.200720\.011|raite/i.test(u),wv=/; wv\)/.test(u);
var m=u.match(/Android ([\d.]+)/),av=m?m[1]:'?';
document.getElementById('v').innerHTML=car?'✅ المتصفح شغال على <span style="color:#ff7a00">شاشة العربية نفسها</span>':'📱 المتصفح ده غالبًا شغال على <span style="color:#ff7a00">الجوال</span> وبيتعرض على الشاشة';
document.getElementById('d').innerHTML='أندرويد: '+av+' · WebView: '+(wv?'نعم':'لا')+' · الشاشة: '+screen.width+'×'+screen.height+' · كثافة: '+devicePixelRatio;
document.getElementById('ua').textContent=u;
</script></body></html>
